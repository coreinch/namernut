name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Without this, two pushes to main in quick succession run as fully
# independent, overlapping workflow runs with no ordering guarantee between
# them — deploy pulls the image tagged with that run's own commit SHA, so a
# slower run for an older commit could finish its deploy job after a faster
# run for a newer commit, silently redeploying stale code with no error
# surfaced anywhere. Grouping by ref serializes runs on the same branch/PR
# instead of letting them race. `cancel-in-progress: false` is deliberate:
# `true` would cancel a queued run outright, including one whose deploy job
# is already mid-SSH into the production VPS, which is worse than the race
# this fixes. Queuing (never cancelling) means each push's run waits its
# turn and the most recently pushed commit is always the one deployed last,
# guaranteeing production ends up on the newest commit.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR image paths must be lowercase; a GitHub username/repo can
      # contain uppercase letters.
      - name: Compute lowercase image repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute deploy image tag
        id: vars
        run: echo "image_tag=main-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          # {{branch}} resolves to an empty string on pull_request-triggered
          # runs (it's only populated for push-to-branch events), which
          # produced an invalid tag like "-0bb9835" and failed the build
          # step outright. Fall back to the PR's head ref in that case —
          # metadata-action sanitizes it (e.g. slashes in a Dependabot
          # branch name) into a valid tag component automatically.
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=${{ github.event_name == 'pull_request' && github.head_ref || '{{branch}}' }}-

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # Build always runs, even on a PR — a Dockerfile break should
          # fail CI loudly. Only the push to the registry is gated to
          # actual pushes to main.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible and required collections
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      # The VPS IP lives only in the DEPLOY_HOST secret, never in the
      # repo — the committed inventory is just hosts.ini.example. This
      # file only ever exists on the ephemeral runner.
      - name: Generate inventory from secret
        run: |
          mkdir -p ansible/inventory
          printf '[production]\nvps ansible_host=%s ansible_user=root\n' "${{ secrets.DEPLOY_HOST }}" > ansible/inventory/hosts.ini

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Ansible deploy playbook
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_PAT: ${{ secrets.GHCR_PULL_PAT }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPENT_API_KEY: ${{ secrets.SERPENT_API_KEY }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          KILOCODE_MODEL: ${{ secrets.KILOCODE_MODEL }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL || secrets.INSTAGRAM_PROXY_URL }}
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: |
          # Built via jq rather than interpolated straight into the
          # ansible-playbook command line: INSTAGRAM_SESSION_ID in
          # particular is an opaque cookie value that can contain shell
          # metacharacters, and jq --arg escapes arbitrary content
          # safely regardless of what's in it.
          jq -n \
            --arg image_tag "$IMAGE_TAG" \
            --arg ghcr_pat "$GHCR_PAT" \
            --arg serper_api_key "$SERPER_API_KEY" \
            --arg serpent_api_key "$SERPENT_API_KEY" \
            --arg kilocode_api_key "$KILOCODE_API_KEY" \
            --arg kilocode_model "$KILOCODE_MODEL" \
            --arg instagram_session_id "$INSTAGRAM_SESSION_ID" \
            --arg proxy_url "$PROXY_URL" \
            --arg twocaptcha_api_key "$TWOCAPTCHA_API_KEY" \
            '$ARGS.named' > /tmp/extra-vars.json

          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy.yml \
            --private-key ~/.ssh/deploy_key \
            -e @/tmp/extra-vars.json
