---
# Where the compose stack lives on the VPS.
deploy_dir: /opt/namernut

# 8090/8091 are already taken by cicd-lab on this VPS; 8092 was confirmed
# free via `ss -tlnp`. Bound to 127.0.0.1 only in
# templates/docker-compose.prod.yml.j2 — reachable only from the VPS
# itself, via the nginx vhost below. No reason for the app to be
# reachable directly from the internet on its own port.
app_port: 8092

# Must match the GHCR path GitHub Actions pushes to: lowercase
# "owner/repo" from ci-cd.yml, derived there from ${{ github.repository }}
# — which tracks the GitHub account's CURRENT name, not whatever it was
# when this file was last edited. Confirmed directly (2026-09-25): the
# account was renamed glassrun -> coreinch at some point, git's own
# push/gh CLI silently followed via GitHub's redirect, so nothing here
# visibly broke — until this hardcoded value, still "glassrun", sent the
# next deploy pulling a manifest that had actually been pushed to
# ghcr.io/coreinch/namernut, and it failed outright ("manifest unknown").
# There's no dynamic way to derive this ansible-side (unlike CI's
# ${{ github.repository }}), so if the account is ever renamed again,
# this needs a manual update too.
ghcr_owner: coreinch
ghcr_repo: namernut
ghcr_image: "ghcr.io/{{ ghcr_owner }}/{{ ghcr_repo }}"

# Overridden per-run from the command line, e.g.:
#   ansible-playbook playbooks/deploy.yml -e image_tag=main-a1b2c3d
image_tag: main

# Public hostname for the app's nginx vhost. Reuses the same self-signed
# cert as every other vhost on this box (see ssl-promptbox.conf):
# Cloudflare terminates the real public HTTPS at its edge and accepts any
# cert from the origin in "Full" mode, so no Let's Encrypt/DNS-01 setup is
# needed here. Confirmed directly (2026-09-22): namernut.com was already
# registered and Cloudflare-proxied, but pointed at a Cloudflare Pages
# deployment of an unrelated old app, not this VPS — repointing that
# (removing the Pages custom-domain binding, or changing whatever DNS
# record currently targets it, to this VPS's IP with the orange-cloud
# proxy kept on) is a Cloudflare-dashboard change outside ansible's/this
# repo's reach, and has to happen before this vhost does anything.
custom_domain: namernut.com
