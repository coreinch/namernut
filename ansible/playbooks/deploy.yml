---
- name: Deploy namernut
  hosts: production
  gather_facts: false

  tasks:
    - name: Verify Docker and the compose plugin are available
      ansible.builtin.command: docker compose version
      register: compose_check
      changed_when: false
      failed_when: compose_check.rc != 0

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Render production docker-compose.yml
      ansible.builtin.template:
        src: ../templates/docker-compose.prod.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    # Contains the app's runtime API keys — 0600, and templated from
    # extra-vars passed at runtime (see ci-cd.yml), never committed.
    - name: Render .env
      ansible.builtin.template:
        src: ../templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"

    # Only needed while the GHCR package is private. Checks non-empty,
    # not just "is defined" — CI always passes -e ghcr_pat=..., even
    # when the secret is unset, in which case GitHub Actions substitutes
    # an empty string rather than omitting the flag.
    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_owner }}"
        password: "{{ ghcr_pat }}"
      when: ghcr_pat is defined and ghcr_pat | length > 0

    # pull: always forces a fresh pull even when the tag string (e.g.
    # "main") is unchanged — the tag is mutable and CI repoints it to a
    # new image on every push.
    - name: Pull image and (re)start the stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        pull: always
        state: present

    # Every deploy pulls a new tag (main-<sha>) and nothing removes the old
    # ones, so the VPS disk fills up over time (it hit 100% once — Chrome-era
    # images were ~1GB each — and everything on the box, including the
    # other sites, started failing). This box is SHARED with other stacks
    # (cicd-lab, wordpress, ...), so this deliberately does NOT run a
    # blanket `docker image prune -a`, which would delete any image that
    # happens not to be running right now, including their stopped ones.
    # Instead: (1) remove only THIS app's older tags beyond the newest
    # `keep_app_images` (kept for a quick rollback), and (2) prune dangling
    # (untagged) images, which nothing can be using. Runs after the stack
    # is up, so the image in use is always the newest tag and is protected
    # twice over (never in the removal list; docker refuses to remove an
    # image a container is using anyway).
    - name: List this app's image tags, newest first
      ansible.builtin.command: docker image ls {{ ghcr_image }} --format "{{ '{{.Repository}}:{{.Tag}}' }}"
      register: app_image_refs
      changed_when: false

    - name: Remove this app's image tags older than the newest {{ keep_app_images }}
      ansible.builtin.command: docker rmi {{ item }}
      loop: "{{ (app_image_refs.stdout_lines | reject('search', ':<none>$') | list)[keep_app_images:] }}"
      register: rmi_result
      changed_when: rmi_result.rc == 0
      # Cleanup must never fail a deploy that already succeeded: an image
      # can be in use (rollback container) or already gone.
      failed_when: false

    - name: Prune dangling images
      ansible.builtin.command: docker image prune -f
      register: prune_result
      changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"
      failed_when: false

    # Touches nginx config shared with every other site on this VPS
    # (cicd-lab, wordpress, and others) — only a new file is written, no
    # existing vhost is touched, and the reload handler refuses to
    # reload if `nginx -t` doesn't pass first. See custom_domain's own
    # comment in group_vars/production.yml. Skipped entirely (rather than
    # rendering a broken/empty server_name) whenever custom_domain is
    # blank, so this stays a no-op for any deployment that hasn't set one.
    - name: Render custom-domain nginx vhost
      ansible.builtin.template:
        src: ../templates/custom-domain.conf.j2
        dest: "/etc/nginx/conf.d/{{ custom_domain }}.conf"
        mode: "0644"
      when: custom_domain is defined and custom_domain | length > 0
      notify:
        - Test nginx config
        - Reload nginx

  handlers:
    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
