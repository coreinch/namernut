---
- name: Deploy namernut
  hosts: production
  gather_facts: false

  tasks:
    - name: Verify Docker and the compose plugin are available
      ansible.builtin.command: docker compose version
      register: compose_check
      changed_when: false
      failed_when: compose_check.rc != 0

    # One-time migration cleanup from the namerag -> namernut rename: the
    # pre-rename stack still holds app_port (127.0.0.1:{{ app_port }}),
    # which blocks the renamed stack's container from binding the same
    # port. Idempotent — a no-op once this has run once and the old
    # directory is gone. Safe to leave in the playbook indefinitely rather
    # than removed after one run: `stat` + `when` means it costs one cheap
    # check on every future deploy and never touches anything once the old
    # directory no longer exists.
    - name: Check for the pre-rename (namerag) deploy directory
      ansible.builtin.stat:
        path: /opt/namerag/docker-compose.yml
      register: legacy_compose

    - name: Tear down the pre-rename namerag stack
      community.docker.docker_compose_v2:
        project_src: /opt/namerag
        state: absent
      when: legacy_compose.stat.exists

    - name: Remove the pre-rename namerag deploy directory
      ansible.builtin.file:
        path: /opt/namerag
        state: absent
      when: legacy_compose.stat.exists

    - name: Check for the pre-rename (namerag) nginx vhost
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/namerag.promptbox.club.conf
      register: legacy_vhost

    - name: Remove the pre-rename namerag nginx vhost
      ansible.builtin.file:
        path: /etc/nginx/conf.d/namerag.promptbox.club.conf
        state: absent
      when: legacy_vhost.stat.exists
      notify:
        - Test nginx config
        - Reload nginx

    # One-time cleanup from dropping the namernut.promptbox.club subdomain
    # vhost in favor of serving solely from custom_domain (namernut.com).
    # Idempotent for the same reason as the namerag cleanup above.
    - name: Check for the retired promptbox.club subdomain vhost
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/namernut.promptbox.club.conf
      register: legacy_subdomain_vhost

    - name: Remove the retired promptbox.club subdomain vhost
      ansible.builtin.file:
        path: /etc/nginx/conf.d/namernut.promptbox.club.conf
        state: absent
      when: legacy_subdomain_vhost.stat.exists
      notify:
        - Test nginx config
        - Reload nginx

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Render production docker-compose.yml
      ansible.builtin.template:
        src: ../templates/docker-compose.prod.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    # Contains the app's runtime API keys — 0600, and templated from
    # extra-vars passed at runtime (see ci-cd.yml), never committed.
    - name: Render .env
      ansible.builtin.template:
        src: ../templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"

    # Only needed while the GHCR package is private. Checks non-empty,
    # not just "is defined" — CI always passes -e ghcr_pat=..., even
    # when the secret is unset, in which case GitHub Actions substitutes
    # an empty string rather than omitting the flag.
    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_owner }}"
        password: "{{ ghcr_pat }}"
      when: ghcr_pat is defined and ghcr_pat | length > 0

    # pull: always forces a fresh pull even when the tag string (e.g.
    # "main") is unchanged — the tag is mutable and CI repoints it to a
    # new image on every push.
    - name: Pull image and (re)start the stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        pull: always
        state: present

    # Touches nginx config shared with every other site on this VPS
    # (cicd-lab, wordpress, and others) — only a new file is written, no
    # existing vhost is touched, and the reload handler refuses to
    # reload if `nginx -t` doesn't pass first. See custom_domain's own
    # comment in group_vars/production.yml. Skipped entirely (rather than
    # rendering a broken/empty server_name) whenever custom_domain is
    # blank, so this stays a no-op for any deployment that hasn't set one.
    - name: Render custom-domain nginx vhost
      ansible.builtin.template:
        src: ../templates/custom-domain.conf.j2
        dest: "/etc/nginx/conf.d/{{ custom_domain }}.conf"
        mode: "0644"
      when: custom_domain is defined and custom_domain | length > 0
      notify:
        - Test nginx config
        - Reload nginx

  handlers:
    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
