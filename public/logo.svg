<!-- Not referenced anywhere in the app (icon.tsx/apple-icon.tsx/opengraph-image.tsx
     generate their own icons dynamically) — kept as a standalone brand-mark
     asset in case something external links to /logo.svg directly. Its "n"
     used the pre-Round-5 accent gradient (#ff6b35 -> #ff9466), missed by
     Round 6's icon.tsx/apple-icon.tsx/opengraph-image.tsx/manifest.ts fix
     since this file lives under public/, not src/ — now a flat #c24618,
     matching every other current icon surface exactly rather than
     reintroducing a new, undocumented gradient variant. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2158"/>
      <stop offset="1" stop-color="#100a29"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <text x="256" y="364" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="300" fill="#c24618" text-anchor="middle" letter-spacing="-8">n</text>
</svg>
